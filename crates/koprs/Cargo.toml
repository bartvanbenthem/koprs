[package]
name = "koprs"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
description = "A reusable, ergonomic library that streamlines Kubernetes operator development, allowing developers to build controllers with significantly less code."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kubernetes", "operators", "controllers", "operator-sdk", "kube-rs"]
categories = ["api-bindings"]

[lib]
name = "koprs"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
futures.workspace = true
json-patch = "4"
k8s-openapi.workspace = true
kube.workspace = true
kube-runtime.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time", "sync"] }
tracing.workspace = true
http-body-util = "0.1.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
prometheus = { version = "0.14.0", default-features = false }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "test-util"] }
tower-test = "0.4"
chrono = { version = "0.4", features = ["clock"] }
http       = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[features]
integration = []
