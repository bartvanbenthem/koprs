[package]
name = "koprs-admission"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
description = "Validating admission webhook server for Kubernetes operators, designed as a companion to koprs."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kubernetes", "admission", "webhook", "operator", "validation"]
categories = ["api-bindings", "web-programming"]

[lib]
name = "koprs_admission"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time", "sync"] }
tracing.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful"] }
bytes.workspace = true
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"

[features]
integration = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration"]
