[package]
name = "koprs-external"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
description = "Generic polling watchers for external sources such as HTTP APIs and object stores, designed as a companion to koprs Kubernetes operators."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kubernetes", "operator", "watcher", "http", "polling"]
categories = ["web-programming", "asynchronous"]

[lib]
name = "koprs_external"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
futures.workspace = true
bytes.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing.workspace = true

[dependencies.object_store]
version = "0.11"
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
kube.workspace = true
k8s-openapi.workspace = true

[features]
default = []
object-store = ["dep:object_store"]
integration = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration"]
