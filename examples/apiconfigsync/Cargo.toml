[package]
name = "apiconfigsync-operator"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "apiconfigsync-operator"
path = "src/main.rs"

[dependencies]
koprs = { path = "../../crates/koprs" }
koprs-admission = { path = "../../crates/koprs-admission" }
koprs-external = { path = "../../crates/koprs-external" }
kube = { workspace = true }
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
schemars.workspace = true
serde = { workspace = true }
serde_json = "1.0"
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
serde-saphyr = "0.0.29"
