# manifests/deployment.yaml
#
# The apiconfigsync operator: controller + admission webhook in one binary.
# Two replicas — one leader reconciles, both serve the webhook.
#
# Build and load the image first (see README), e.g. for kind:
#   docker build -f examples/apiconfigsync/Dockerfile -t apiconfigsync-operator:dev .
#   kind load docker-image apiconfigsync-operator:dev
#
# Apply with: kubectl apply -f manifests/deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiconfigsync-operator
  namespace: apiconfigsync-system
  labels:
    app.kubernetes.io/name: apiconfigsync-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: apiconfigsync-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apiconfigsync-operator
    spec:
      serviceAccountName: apiconfigsync-operator
      # Lets in-flight reconciles and webhook requests drain on SIGTERM.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: apiconfigsync-operator:dev
          imagePullPolicy: IfNotPresent
          env:
            # Unique leader-election identity per pod.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Namespace holding the leader-election Lease.
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: info
            # Outbound URL policy (see src/url_policy.rs). Restrict to the
            # hosts your CRs are allowed to poll.
            - name: APICONFIGSYNC_ALLOWED_HOSTS
              value: "config.example.com"
            - name: APICONFIGSYNC_ALLOW_HTTP
              value: "false"
            - name: APICONFIGSYNC_ALLOW_PRIVATE_NETWORKS
              value: "false"
            - name: WEBHOOK_TLS_CERT
              value: /tls/tls.crt
            - name: WEBHOOK_TLS_KEY
              value: /tls/tls.key
          ports:
            - name: health
              containerPort: 8080
            - name: webhook-health
              containerPort: 8081
            - name: webhook
              containerPort: 8443
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          # Ready = webhook is serving. Independent of leadership, so standby
          # replicas are Ready and receive webhook traffic.
          readinessProbe:
            httpGet:
              path: /readyz
              port: webhook-health
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: webhook-tls
          secret:
            secretName: apiconfigsync-webhook-tls
