name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt, clippy (-D warnings), unit + doc tests
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/cargo-ci.sh --fast --no-audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Licenses and RustSec advisories (deny.toml)
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories

  # Integration tests against a real cluster: multiple CRs / owners, GC across
  # namespaces, finalizer coexistence, and two-replica leader election failover.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: helm/kind-action@v1
        with:
          cluster_name: koprs-ci
      - run: cargo test -p koprs --features integration --test integration
      - run: cargo test -p koprs-admission --features integration --test integration
      - run: cargo test -p koprs-external --features integration --test integration
