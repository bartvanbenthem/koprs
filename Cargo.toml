[workspace]
members = ["crates/*", "examples/configmapsync", "examples/multicontroller", "examples/apiconfigsync"]
resolver = "2"

[workspace.package]
version = "0.12.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/bartvanbenthem/koprs"
description = "A collection of reusable Rust libraries for Kubernetes operator development, enabling operators built with significantly less code."

[workspace.dependencies]
kube = { version = "4.2.0", features = ["runtime", "derive"] }
kube-runtime = "4.2.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.0"
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_36"] }
thiserror = "1"
serde_json = "1"
tracing = "0.1"
futures = "0.3"
bytes = "1"